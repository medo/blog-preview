baseURL: "https://farghal.ai/"
locale: "en-us"
title: "medo's notes"
theme: ["PaperMod"]

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true

pagination:
  pagerSize: 10

minify:
  disableXML: true
  minifyOutput: true

markup:
  goldmark:
    renderer:
      unsafe: true
    extensions:
      passthrough:
        delimiters:
          block:
            - ['\[', '\]']
            - ['$$', '$$']
          inline:
            - ['\(', '\)']
            - ['$', '$']
        enable: true
  highlight:
    noClasses: false
    style: github

params:
  env: production
  title: "medo's notes"
  description: "Notes on technology, science, and human-first AI."
  author: "Mohamed Farghal"

  defaultTheme: auto
  disableThemeToggle: false

  ShowReadingTime: true
  ShowShareButtons: false
  ShowPostNavLinks: true
  ShowBreadCrumbs: false
  ShowCodeCopyButtons: true
  ShowWordCount: false
  ShowRssButtonInSectionTermList: false
  UseHugoToc: true
  disableSpecial1stPost: true
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: true
  tocopen: false
  math: true

  assets:
    disableHLJS: true

  label:
    text: "medo's notes"

  homeInfoParams:
    Title: "medo's notes"
    Content: ""

  # Add your social links here when ready:
  # socialIcons:
  #   - name: github
  #     url: "https://github.com/<username>"
  #   - name: x
  #     url: "https://x.com/<username>"
  #   - name: linkedin
  #     url: "https://linkedin.com/in/<username>"
  #   - name: rss
  #     url: "index.xml"

menu:
  main:
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 10
    - identifier: about
      name: About
      url: /about/
      weight: 20

outputs:
  home:
    - HTML
    - RSS
